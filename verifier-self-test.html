<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS SHA-256 Self-Test</title><style>body{font:16px system-ui;background:#0b1020;color:#eee;padding:20px;max-width:700px;margin:auto}pre{background:#161f33;padding:12px;overflow-wrap:anywhere;border-radius:8px}.ok{color:#72e5b2}.bad{color:#ff8f8f}</style><h1>AEGIS SHA-256 Self-Test</h1><p>Runs known-answer vectors against the browser Web Crypto API. This tests the crypto primitive availability and known outputs—not the full verifier UI.</p><div id="results">Running…</div><script>
const vectors=[{name:"Empty input",input:"",expected:"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},{name:"ASCII abc",input:"abc",expected:"ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"}];
(async()=>{const el=document.getElementById('results');let passed=0;const rows=[];for(const v of vectors){try{const bytes=new TextEncoder().encode(v.input);const dig=await crypto.subtle.digest('SHA-256',bytes);const got=[...new Uint8Array(dig)].map(x=>x.toString(16).padStart(2,'0')).join('');const ok=got===v.expected;if(ok)passed++;rows.push('<p class="'+(ok?'ok':'bad')+'">'+(ok?'PASS':'FAIL')+' — '+v.name+'</p><pre>Expected: '+v.expected+'\nActual:   '+got+'</pre>')}catch(e){rows.push('<p class="bad">ERROR — '+v.name+': '+String(e)+'</p>')}}el.innerHTML='<h2>'+passed+'/'+vectors.length+' passed</h2>'+rows.join('')+'<p>Run in a modern browser secure context (HTTPS or localhost).';})();
</script>
