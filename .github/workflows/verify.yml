name: AEGIS TRUST repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JSON Schema validator
        run: npm install --no-save ajv@8 ajv-formats@3
      - name: Run repository validation
        run: |
          node tests/verify_repo.mjs
          node tests/verify_evidence_vectors.mjs
          node tests/verify_evidence_schema_graph.mjs
          node tests/verify_graph_engine.mjs
